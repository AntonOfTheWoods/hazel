apiVersion: v1
kind: Pod
metadata:
  name: electric-proxy
  labels:
    app: electric-proxy
spec:
  restartPolicy: Never
  containers:
    - name: electric-proxy
      image: oven/bun:1.3-distroless
      workingDir: /workspace/apps/electric-proxy
      command: ["bun", "run", "start"]
      volumeMounts:
        - name: code
          mountPath: /workspace
          readOnly: true
  volumes:
    - name: code
      image:
        reference: ghcr.io/your-org/hazel-electric-proxy-code:latest
        pullPolicy: IfNotPresent
