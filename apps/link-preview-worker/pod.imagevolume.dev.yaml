apiVersion: v1
kind: Pod
metadata:
  name: link-preview-worker-dev
  labels:
    app: link-preview-worker
    mode: dev
spec:
  restartPolicy: Always
  containers:
    - name: link-preview-worker
      image: oven/bun:1.3-distroless
      workingDir: /workspace/apps/link-preview-worker
      command: ["bun", "run", "dev:local"]
      volumeMounts:
        - name: code
          mountPath: /workspace
          readOnly: true
      ports:
        - containerPort: 5471
  volumes:
    - name: code
      image:
        reference: ghcr.io/your-org/hazel-link-preview-worker-code:latest
        pullPolicy: IfNotPresent
