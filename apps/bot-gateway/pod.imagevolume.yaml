apiVersion: v1
kind: Pod
metadata:
  name: bot-gateway
  labels:
    app: bot-gateway
spec:
  restartPolicy: Never
  containers:
    - name: bot-gateway
      image: oven/bun:1.3-distroless
      workingDir: /workspace/apps/bot-gateway
      command: ["bun", "run", "start"]
      volumeMounts:
        - name: code
          mountPath: /workspace
          readOnly: true
  volumes:
    - name: code
      image:
        reference: ghcr.io/your-org/hazel-bot-gateway-code:latest
        pullPolicy: IfNotPresent
