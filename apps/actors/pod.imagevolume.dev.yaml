apiVersion: v1
kind: Pod
metadata:
  name: actors-dev
  labels:
    app: actors
    mode: dev
spec:
  restartPolicy: Always
  containers:
    - name: actors
      image: oven/bun:1.3-distroless
      workingDir: /workspace/apps/actors
      command: ["bun", "run", "dev", "--port=6420"]
      volumeMounts:
        - name: code
          mountPath: /workspace
          readOnly: true
      ports:
        - containerPort: 6420
  volumes:
    - name: code
      image:
        reference: ghcr.io/your-org/hazel-actors-code:latest
        pullPolicy: IfNotPresent
