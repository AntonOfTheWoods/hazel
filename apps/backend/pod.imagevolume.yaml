apiVersion: v1
kind: Pod
metadata:
  name: backend
  labels:
    app: backend
spec:
  restartPolicy: Never
  containers:
    - name: backend
      image: oven/bun:1.3-distroless
      workingDir: /workspace/apps/backend
      command: ["bun", "run", "start"]
      volumeMounts:
        - name: code
          mountPath: /workspace
          readOnly: true
  volumes:
    - name: code
      image:
        reference: ghcr.io/your-org/hazel-backend-code:latest
        pullPolicy: IfNotPresent
