apiVersion: v1
kind: Pod
metadata:
  name: cluster
  labels:
    app: cluster
spec:
  restartPolicy: Never
  containers:
    - name: cluster
      image: oven/bun:1.3-distroless
      workingDir: /workspace/apps/cluster
      command: ["bun", "run", "start"]
      volumeMounts:
        - name: code
          mountPath: /workspace
          readOnly: true
      ports:
        - containerPort: 3020
  volumes:
    - name: code
      image:
        reference: ghcr.io/your-org/hazel-cluster-code:latest
        pullPolicy: IfNotPresent
