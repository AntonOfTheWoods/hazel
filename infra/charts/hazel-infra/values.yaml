minio:
  enabled: false
  extendedOperator:
    # Set this to create a user for hazel to use for storage
    # The secret with this name must exist and contain keys `secretKey`
    # You can use the provided `kube/kube/k3d-deploy/secrets/hazel-infra/s3-storage.json` to create such a secret
    user:
      name: s3-storage
      secretName: s3-storage
      secretKeyName: password

    buckets:
      - name: hazel
        versioning: true
      - name: hazeluploads
        versioning: true
      - name: hazelgrades
        versioning: true
      - name: hazelprofiles
        versioning: true
      - name: public
        versioning: true
        public: true
    extraBuckets: []
      # example:
      # - name: extra-bucket
      #   versioning: false

  # see https://github.com/minio/operator/blob/master/helm/tenant/templates/tenant.yaml
  tenant:
    name: minio-storage
    exposeServices:
      minio: false
      console: false

    # DO NOT SET BUCKETS HERE! They are NOT managed by this operator - see extendedOperator above!
    # buckets: []

    configSecret:
      name: minio-env
      existingSecret: true

    certificate:
      requestAutoCert: false

    # pools:
    #   - servers: 1
    #     name: pool-0
    #     volumesPerServer: 1
    #     size: 5Gi

  ingress:
    api:
      enabled: false
      ingressClassName: "traefik"
      labels: { }
      annotations: { }
      tls: [ ]
      host: files.hazel.localhost
      path: /
      pathType: Prefix
    console:
      enabled: false
      ingressClassName: "traefik"
      labels: { }
      annotations: { }
      tls: [ ]
      host: minio-console.hazel.localhost
      path: /
      pathType: Prefix

redis:
  enabled: true
  # FIXME: externalConfig is not actually used but by being present, it avoids a bug in chart versions 0.16.7-9
  externalConfig:
    enabled: true
  redisStandalone:
    name: kv-rw  # apparently MUST be set or it will default to the release name
    tag: "v7.4.8"
    # tag: "v8.4.2"
