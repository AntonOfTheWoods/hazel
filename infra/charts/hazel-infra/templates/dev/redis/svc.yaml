{{- if and .Values.redis.enabled .Values.project.local.enableNodePorts -}}
apiVersion: v1
kind: Service
metadata:
  name: kv-nodeport
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: hazel
    app.kubernetes.io/name:

spec:
  type: NodePort
  ports:
  - name: nodeport-kv
    nodePort: 30434
    port: 6379
    protocol: TCP
    targetPort: 6379
  selector:
    app.kubernetes.io/component: middleware
    app.kubernetes.io/instance: kv
    app.kubernetes.io/name: kv
    app: kv

{{- end -}}
