{{- if and .Values.hazel.isDev .Values.hazel.dev.files.lbIP .Values.hazel.dev.backups.lbIP -}}
{{- $domains := (list .Values.minio.ingress.api.host ) | uniq -}}
{{- $backupsDomains := (list .Values.db.backups.host ) | uniq -}}
{{- $allDomains := (concat $domains $backupsDomains) | uniq -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom # this is the name of the configmap you can overwrite with your changes
  namespace: kube-system
data:
    files.server: |
          {{ join " " $allDomains }} {
              hosts {
                  {{ .Values.hazel.dev.files.lbIP }} {{ join " " $domains }}
                  {{ .Values.hazel.dev.backups.lbIP }} {{ join " " $backupsDomains }}
                  fallthrough
              }
          }
{{- end -}}
