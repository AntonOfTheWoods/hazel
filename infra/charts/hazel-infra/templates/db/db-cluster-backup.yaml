{{- if and .Values.dbClusters.db.backups.enabled .Values.dbClusters.db.backups.schedule -}}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.dbClusters.db.cluster.name }}

  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: db-cluster
    hazel.cluster: {{ .Values.dbClusters.db.cluster.name }}
  {{- if or .Values.dbClusters.db.deploymentAnnotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.dbClusters.db.deploymentAnnotations .Values.commonAnnotations) "context" .) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $ ) | nindent 4 }}
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
  {{- end }}

spec:
  schedule: {{ .Values.dbClusters.db.backups.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ .Values.dbClusters.db.cluster.name | quote }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
