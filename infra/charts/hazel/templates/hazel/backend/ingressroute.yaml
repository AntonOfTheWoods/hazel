{{- if and .Values.hazel.traefik.enabled .Values.hazel.enabled .Values.hazel.backend.enabled -}}
{{- $host := .Values.hazel.backend.host }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-ingressroute
  annotations:
    {{- include "hazel.annotations" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
{{- range .Values.hazel.backend.localRoutes }}
    - match: Host(`{{ .host | default $host }}`) && PathPrefix(`{{ .path }}`)
      kind: Rule
      middlewares:
        - name: apps-body-limit
        - name: add-headers
        - name: compress-gzip
{{- if .suppressPath }}
        - name: stripprefix-backend-{{ .name }}
{{- end }}
      services:
        - name: external-backend-{{ .name }}
          port: {{ .port }}
{{- end }}
    - match: Host(`{{ $host }}`)
      kind: Rule
      middlewares:
      - name: add-headers
      - name: compress-gzip
      services:
      - name: backend
        port: {{ .Values.hazel.backend.service.port | default 8000 }}
  tls:
    {{- include "hazel.ingressroute.tlsname" (dict "component" "backend" "root" .) | nindent 4 }}
---
{{- include "hazel.ingressroute.tlscertificate" (dict "component" "backend" "root" .) }}
{{- end -}}
