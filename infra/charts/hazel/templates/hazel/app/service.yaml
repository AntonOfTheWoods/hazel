{{- $root := . -}}
{{- $appKeys := include "hazel.app.keysFor" (dict "root" $root "kind" "service") | fromYamlArray -}}
{{ range $appKey := $appKeys }}
{{ $app := include "hazel.app.config" (dict "root" $root "appKey" $appKey) | fromYaml -}}
{{- $service := default (dict) $app.service -}}
{{- $servicePorts := default (dict) $service.ports -}}
{{- $serviceNodePorts := default (dict) $service.nodePorts -}}
{{ if eq (include "hazel.app.enabled" (dict "root" $root "appKey" $appKey) | trim) "true" }}
{{- $fullname := include "hazel.app.fullname" (dict "root" $root "appKey" $appKey) -}}
{{- $component := include "hazel.app.component" (dict "appKey" $appKey) -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  namespace: {{ include "common.names.namespace" $root | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $root.Values.commonLabels "context" $root ) | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    app.kubernetes.io/part-of: hazel
  {{- if or $service.annotations $root.Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list $service.annotations $root.Values.commonAnnotations) "context" $root) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $root ) | nindent 4 }}
  {{- end }}
spec:
  type: {{ default "ClusterIP" $service.type }}
  {{- if and $service.clusterIP (eq (default "ClusterIP" $service.type) "ClusterIP") }}
  clusterIP: {{ $service.clusterIP }}
  {{- end }}
  {{- if $service.sessionAffinity }}
  sessionAffinity: {{ $service.sessionAffinity }}
  {{- end }}
  {{- if $service.sessionAffinityConfig }}
  sessionAffinityConfig: {{- include "common.tplvalues.render" (dict "value" $service.sessionAffinityConfig "context" $root) | nindent 4 }}
  {{- end }}
  {{- if or (eq (default "ClusterIP" $service.type) "LoadBalancer") (eq (default "ClusterIP" $service.type) "NodePort") }}
  externalTrafficPolicy: {{ default "Cluster" $service.externalTrafficPolicy | quote }}
  {{- end }}
  {{- if and (eq (default "ClusterIP" $service.type) "LoadBalancer") (not (empty $service.loadBalancerSourceRanges)) }}
  loadBalancerSourceRanges: {{ $service.loadBalancerSourceRanges }}
  {{- end }}
  {{- if and (eq (default "ClusterIP" $service.type) "LoadBalancer") (not (empty $service.loadBalancerIP)) }}
  loadBalancerIP: {{ $service.loadBalancerIP }}
  {{- end }}
  ports:
    - name: http
      port: {{ default 80 $servicePorts.http }}
      targetPort: http
      protocol: TCP
      {{- if and (or (eq (default "ClusterIP" $service.type) "NodePort") (eq (default "ClusterIP" $service.type) "LoadBalancer")) (not (empty $serviceNodePorts.http)) }}
      nodePort: {{ $serviceNodePorts.http }}
      {{- else if eq (default "ClusterIP" $service.type) "ClusterIP" }}
      nodePort: null
      {{- end }}
    {{- if $service.extraPorts }}
    {{- include "common.tplvalues.render" (dict "value" $service.extraPorts "context" $root) | nindent 4 }}
    {{- end }}
  {{- $podLabels := include "common.tplvalues.merge" (dict "values" (list $app.podLabels $root.Values.commonLabels) "context" $root) | fromYaml }}
  selector: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $root ) | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    app.kubernetes.io/part-of: hazel
{{- end }}
{{- end }}
