{{- $root := . -}}
{{- $appKeys := include "hazel.app.keysFor" (dict "root" $root "kind" "networkPolicy") | fromYamlArray -}}
{{ range $appKey := $appKeys }}
{{ $app := include "hazel.app.config" (dict "root" $root "appKey" $appKey) | fromYaml -}}
{{- $networkPolicy := default (dict) $app.networkPolicy -}}
{{- $containerPorts := default (dict) $app.containerPorts -}}
{{ if and (eq (include "hazel.app.enabled" (dict "root" $root "appKey" $appKey) | trim) "true") (default false $networkPolicy.enabled) }}
{{- $fullname := include "hazel.app.fullname" (dict "root" $root "appKey" $appKey) -}}
{{- $component := include "hazel.app.component" (dict "appKey" $appKey) -}}
---
kind: NetworkPolicy
apiVersion: {{ include "common.capabilities.networkPolicy.apiVersion" $root }}
metadata:
  name: {{ $fullname }}
  namespace: {{ include "common.names.namespace" $root | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $root.Values.commonLabels "context" $root ) | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    app.kubernetes.io/part-of: hazel
  {{- if $root.Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $root.Values.commonAnnotations "context" $root ) | nindent 4 }}
  {{- end }}
spec:
  {{- $podLabels := include "common.tplvalues.merge" ( dict "values" ( list $app.podLabels $root.Values.commonLabels ) "context" $root ) }}
  podSelector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $root ) | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
      app.kubernetes.io/part-of: hazel
  policyTypes:
    - Ingress
    - Egress
  egress:
    {{- if $networkPolicy.allowExternalEgress }}
    - {}
    {{- else }}
    - ports:
        # Allow dns resolution
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: {{ include "hazel.redis.port" $root }}
          {{- if $root.Values.redis.enabled }}
          to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: redis
                  app.kubernetes.io/instance: {{ $root.Release.Name }}
          {{- end }}
    - ports:
        - port: {{ include "hazel.postgresql.port" $root }}
          {{- if $root.Values.postgresql.enabled }}
          to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: postgresql
                  app.kubernetes.io/instance: {{ $root.Release.Name }}
          {{- end }}
    {{- if $networkPolicy.extraEgress }}
    {{- include "common.tplvalues.render" ( dict "value" $networkPolicy.extraEgress "context" $root ) | nindent 4 }}
    {{- end }}
    {{- end }}
  ingress:
    - ports:
        - port: {{ default 8080 $containerPorts.http }}
      {{- if not $networkPolicy.allowExternal }}
      from:
        - podSelector:
            matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $root.Values.commonLabels "context" $root ) | nindent 14 }}
        {{- if $networkPolicy.addExternalClientAccess }}
        - podSelector:
            matchLabels:
              {{ printf "%s-%s" (include "common.names.fullname" $root) (include "hazel.app.key" (dict "appKey" $appKey)) }}-client: "true"
        {{- end }}
        {{- if $networkPolicy.ingressPodMatchLabels }}
        - podSelector:
            matchLabels: {{- include "common.tplvalues.render" (dict "value" $networkPolicy.ingressPodMatchLabels "context" $root ) | nindent 14 }}
        {{- end }}
        {{- if $networkPolicy.ingressNSMatchLabels }}
        - namespaceSelector:
            matchLabels: {{- include "common.tplvalues.render" (dict "value" $networkPolicy.ingressNSMatchLabels "context" $root ) | nindent 14 }}
          {{- if $networkPolicy.ingressNSPodMatchLabels }}
          podSelector:
            matchLabels:
              matchLabels: {{- include "common.tplvalues.render" (dict "value" $networkPolicy.ingressNSPodMatchLabels "context" $root ) | nindent 14 }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- if $networkPolicy.extraIngress }}
    {{- include "common.tplvalues.render" ( dict "value" $networkPolicy.extraIngress "context" $root ) | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
