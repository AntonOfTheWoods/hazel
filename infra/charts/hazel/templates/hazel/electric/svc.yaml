apiVersion: v1
kind: Service
metadata:
  name: {{ template "project.electric.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "project.electric.labels" . | nindent 4 }}

  {{- if or .Values.electric.service.annotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.electric.service.annotations .Values.commonAnnotations ) "context" . ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.electric.service.type }}
  {{- if and .Values.electric.service.clusterIP (eq .Values.electric.service.type "ClusterIP") }}
  clusterIP: {{ .Values.electric.service.clusterIP }}
  {{- end }}
  {{- if .Values.electric.service.sessionAffinity }}
  sessionAffinity: {{ .Values.electric.service.sessionAffinity }}
  {{- end }}
  {{- if .Values.electric.service.sessionAffinityConfig }}
  sessionAffinityConfig: {{- include "common.tplvalues.render" (dict "value" .Values.electric.service.sessionAffinityConfig "context" $) | nindent 4 }}
  {{- end }}
  {{- if or (eq .Values.electric.service.type "LoadBalancer") (eq .Values.electric.service.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.electric.service.externalTrafficPolicy | quote }}
  {{- end }}
  {{- if and (eq .Values.electric.service.type "LoadBalancer") (not (empty .Values.electric.service.loadBalancerSourceRanges)) }}
  loadBalancerSourceRanges: {{ .Values.electric.service.loadBalancerSourceRanges }}
  {{- end }}
  {{- if and (eq .Values.electric.service.type "LoadBalancer") (not (empty .Values.electric.service.loadBalancerIP)) }}
  loadBalancerIP: {{ .Values.electric.service.loadBalancerIP }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.electric.service.ports.http }}
      protocol: TCP
      {{- if and (or (eq .Values.electric.service.type "NodePort") (eq .Values.electric.service.type "LoadBalancer")) (not (empty .Values.electric.service.nodePorts.http)) }}
      nodePort: {{ .Values.electric.service.nodePorts.http }}
      targetPort: http
      {{- else if eq .Values.electric.service.type "ClusterIP" }}
      nodePort: null
      targetPort: {{ .Values.electric.containerPorts.http }}
      {{- end }}
    {{- if .Values.electric.service.extraPorts }}
    {{- include "common.tplvalues.render" (dict "value" .Values.electric.service.extraPorts "context" $) | nindent 4 }}
    {{- end }}
  {{- $podLabels := include "common.tplvalues.merge" ( dict "values" ( list .Values.electric.podLabels .Values.commonLabels ) "context" . ) }}
  selector:
    {{- include "project.electric.matchLabels" . | nindent 4 }}
