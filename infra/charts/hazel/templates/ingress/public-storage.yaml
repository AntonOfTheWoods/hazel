{{/*
# FIXME: this may or may not be needed!

{{- if and .Values.traefik.enabled .Values.publicStoragePaths -}}
{{- $host := .Values.web.host }}
{{- $s3host := .Values.s3.host | default "s3" }}
{{- $s3port := .Values.s3.port | default 80 }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: public-storage-ingressroute
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: public-storage
    app.kubernetes.io/part-of: hazel
  {{- if or .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.commonAnnotations) "context" .) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $ ) | nindent 4 }}
  {{- end }}

spec:
  entryPoints:
    - websecure
  routes:
    {{- range .Values.publicStoragePaths }}
    - match: Host(`{{ $host }}`) && PathPrefix(`{{ . }}`)
      kind: Rule
      services:
        - name: {{ $s3host }}
          port: {{ $s3port }}
    {{- end }}

  tls:
    {{- include "hazel.ingressroute.tlsname" (dict "component" "web" "root" .) | nindent 4 }}

{{- end -}}

*/}}