global:
  namespace: hazel
  hazelVersion: "1.0.1"
  instanceId: "hazel-instance"
  redirectHttp: true
  imageRegistry: ""
  ## e.g:
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  ##
  imagePullSecrets: []
  storageClass: ""
  ## Compatibility adaptations for Kubernetes platforms
  ##
  compatibility:
    ## Compatibility adaptations for Openshift
    ##
    openshift:
      ## @param global.compatibility.openshift.adaptSecurityContext Adapt the securityContext sections of the deployment to make them compatible with Openshift restricted-v2 SCC: remove runAsUser, runAsGroup and fsGroup and let the platform use their allowed default IDs. Possible values: auto (apply if the detected running cluster is Openshift), force (perform the adaptation always), disabled (do not perform adaptation)
      ##
      adaptSecurityContext: auto

## @section Common parameters
##

## @param kubeVersion Override Kubernetes version
##
kubeVersion: ""
## @param apiVersions Override Kubernetes API versions reported by .Capabilities
##
apiVersions: []
## @param nameOverride String to partially override common.names.name
##
nameOverride: ""
## @param fullnameOverride String to fully override common.names.fullname
##
fullnameOverride: ""
## @param namespaceOverride String to fully override common.names.namespace
##
namespaceOverride: ""
## @param commonLabels Labels to add to all deployed objects
##
commonLabels:
  app.kubernetes.io/part-of: hazel
  # app.kubernetes.io/managed-by: Helm

## @param commonAnnotations Annotations to add to all deployed objects
##
commonAnnotations: {}
## @param clusterDomain Kubernetes cluster domain name
##
clusterDomain: cluster.local
## @param extraDeploy Array of extra objects to deploy with the release
##
extraDeploy: []
## @param usePasswordFiles Mount credentials as files instead of using an environment variable
##
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

psqlImage:
  # should already be in the cluster from the db cluster setup, so no need to pull
  # ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
  registry: docker.io
  repository: postgres
  tag: 18-alpine
  pullPolicy: IfNotPresent

kvImage:
  # should already be in the cluster from the kv cluster setup, so no need to pull
  # quay.io/opstree/redis:7.4.8
  registry: docker.io
  repository: redis
  tag: 8-alpine
  pullPolicy: IfNotPresent

project:
  local:
    enableNodePorts: false

hazel:
  # Dev settings
  isDev: false
  local:
    # if set and `isDev: true`, will mount a volume from this path (useful for local development)
    # WARNING: this path will be inside the k3d container if using k3d, not your host machine,
    # so if you want to use your host machine path, you need to mount it in k3d first at cluster creation time!
    # This will be done automatically if using the kube scripts
    src: true

## Generic app templates contract
##
apps:
  generic:
    deployment: [web, cluster, docs, botgateway]
    service: [web, cluster, docs, botgateway]
    hpa: [web, cluster, docs, botgateway]
    networkPolicy: [web, cluster, docs, botgateway]
    pdb: [web, cluster, docs, botgateway]
    vpa: [web, cluster, docs, botgateway]

  validation:
    failOnMissingAppConfig: true
    failOnUnknownAppInGenericLists: true

  defaults:
    ## @param apps.defaults.enabled Enable app by default for keys listed under apps.generic.*
    ##
    enabled: true
    ## @param apps.defaults.replicaCount Number of replicas to deploy
    ##
    replicaCount: 1
    ## @param apps.defaults.automountServiceAccountToken Mount Service Account token in app pods
    ##
    automountServiceAccountToken: false
    ## @param apps.defaults.podLabels Extra labels for app pods
    ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
    ## e.g:
    ## podLabels:
    ##   tier: frontend
    ##   team: platform
    ##
    podLabels: {}
    ## @param apps.defaults.podAnnotations Annotations for app pods
    ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    ## e.g:
    ## podAnnotations:
    ##   prometheus.io/scrape: "true"
    ##   prometheus.io/port: "8080"
    ##
    podAnnotations: {}
    ## @param apps.defaults.podAffinityPreset Pod affinity preset. Ignored if `apps.defaults.affinity` is set. Allowed values: `soft` or `hard`
    ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
    ##
    podAffinityPreset: ""
    ## @param apps.defaults.podAntiAffinityPreset Pod anti-affinity preset. Ignored if `apps.defaults.affinity` is set. Allowed values: `soft` or `hard`
    ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
    ##
    podAntiAffinityPreset: soft
    ## Node affinity preset
    ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
    ##
    nodeAffinityPreset:
      ## @param apps.defaults.nodeAffinityPreset.type Node affinity preset type. Ignored if `apps.defaults.affinity` is set. Allowed values: `soft` or `hard`
      ##
      type: ""
      ## @param apps.defaults.nodeAffinityPreset.key Node label key to match. Ignored if `apps.defaults.affinity` is set
      ##
      key: ""
      ## @param apps.defaults.nodeAffinityPreset.values Node label values to match. Ignored if `apps.defaults.affinity` is set
      ## e.g:
      ## values:
      ##   - e2e-az1
      ##   - e2e-az2
      ##
      values: []
    ## @param apps.defaults.affinity Affinity for app pods assignment
    ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
    ## NOTE: apps.defaults.podAffinityPreset, apps.defaults.podAntiAffinityPreset, and apps.defaults.nodeAffinityPreset are ignored when set
    ## e.g:
    ## affinity:
    ##   nodeAffinity:
    ##     requiredDuringSchedulingIgnoredDuringExecution:
    ##       nodeSelectorTerms:
    ##         - matchExpressions:
    ##             - key: kubernetes.io/os
    ##               operator: In
    ##               values: [linux]
    ##
    affinity: {}
    ## @param apps.defaults.nodeSelector Node labels for app pods assignment
    ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
    ## e.g:
    ## nodeSelector:
    ##   kubernetes.io/arch: amd64
    ##
    nodeSelector: {}
    ## @param apps.defaults.tolerations Tolerations for app pods assignment
    ## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
    ## e.g:
    ## tolerations:
    ##   - key: dedicated
    ##     operator: Equal
    ##     value: backend
    ##     effect: NoSchedule
    ##
    tolerations: []
    ## @param apps.defaults.priorityClassName App pods priorityClassName
    ##
    priorityClassName: ""
    ## @param apps.defaults.schedulerName Name of the Kubernetes scheduler (other than default)
    ##
    schedulerName: ""
    ## @param apps.defaults.topologySpreadConstraints Topology spread constraints for pods
    ## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
    ## e.g:
    ## topologySpreadConstraints:
    ##   - maxSkew: 1
    ##     topologyKey: kubernetes.io/hostname
    ##     whenUnsatisfiable: ScheduleAnyway
    ##     labelSelector:
    ##       matchLabels:
    ##         app.kubernetes.io/part-of: hazel
    ##
    topologySpreadConstraints: []
    ## Configure Pods Security Context
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
    ##
    podSecurityContext:
      ## @param apps.defaults.podSecurityContext.enabled Enable pods' Security Context
      ##
      enabled: true
      ## @param apps.defaults.podSecurityContext.fsGroupChangePolicy Set filesystem group change policy for pods
      ##
      fsGroupChangePolicy: Always
      ## @param apps.defaults.podSecurityContext.sysctls Set kernel settings using sysctl interface
      ## e.g:
      ## sysctls:
      ##   - name: net.core.somaxconn
      ##     value: "1024"
      ##
      sysctls: []
      ## @param apps.defaults.podSecurityContext.supplementalGroups Set filesystem extra groups
      ## e.g:
      ## supplementalGroups: [1001, 1002]
      ##
      supplementalGroups: []
      ## @param apps.defaults.podSecurityContext.fsGroup Set fsGroup in pods' Security Context
      ##
      fsGroup: 1001
    ## Configure Container Security Context
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
    ##
    containerSecurityContext:
      ## @param apps.defaults.containerSecurityContext.enabled Enable container Security Context
      ##
      enabled: true
      ## @param apps.defaults.containerSecurityContext.seLinuxOptions Set SELinux options
      ## e.g:
      ## seLinuxOptions:
      ##   level: "s0:c123,c456"
      ##
      seLinuxOptions: {}
      ## @param apps.defaults.containerSecurityContext.runAsUser Set runAsUser
      ##
      runAsUser: 1001
      ## @param apps.defaults.containerSecurityContext.runAsGroup Set runAsGroup
      ##
      runAsGroup: 1001
      ## @param apps.defaults.containerSecurityContext.runAsNonRoot Set runAsNonRoot
      ##
      runAsNonRoot: true
      ## @param apps.defaults.containerSecurityContext.readOnlyRootFilesystem Set readOnlyRootFilesystem
      ##
      readOnlyRootFilesystem: false
      ## @param apps.defaults.containerSecurityContext.privileged Set privileged
      ##
      privileged: false
      ## @param apps.defaults.containerSecurityContext.allowPrivilegeEscalation Set allowPrivilegeEscalation
      ##
      allowPrivilegeEscalation: false
      ## @param apps.defaults.containerSecurityContext.capabilities.drop List of capabilities to drop
      ##
      capabilities:
        drop: ["ALL"]
      ## @param apps.defaults.containerSecurityContext.seccompProfile.type Set seccomp profile
      ##
      seccompProfile:
        type: "RuntimeDefault"
    ## @param apps.defaults.command Override default container command (useful when using custom images)
    ## e.g:
    ## command: ["/bin/sh", "-c"]
    ##
    command: []
    ## @param apps.defaults.args Override default container args (useful when using custom images)
    ## e.g:
    ## args: ["node server.js"]
    ##
    args: []
    ## @param apps.defaults.lifecycleHooks Lifecycle hooks for app containers
    ## e.g:
    ## lifecycleHooks:
    ##   preStop:
    ##     exec:
    ##       command: ["/bin/sh", "-c", "sleep 5"]
    ##
    lifecycleHooks: {}
    ## @param apps.defaults.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, small, medium, large, xlarge, 2xlarge)
    ## This is ignored if apps.defaults.resources is set.
    ##
    resourcesPreset: "none"
    ## @param apps.defaults.resources Set container requests/limits for CPU/memory
    ## Example:
    ## resources:
    ##   requests:
    ##     cpu: 200m
    ##     memory: 256Mi
    ##   limits:
    ##     cpu: 500m
    ##     memory: 512Mi
    ##
    resources: {}
    ## @param apps.defaults.terminationGracePeriodSeconds Seconds pods need to terminate gracefully
    ##
    terminationGracePeriodSeconds: ""
    ## @param apps.defaults.role Default role string exposed via hazel_ROLE env var
    ##
    role: webserver
    ## @param apps.defaults.portEnvVarName Default port env var name
    ##
    portEnvVarName: hazel_WEBSERVER_PORT_NUMBER
    ## @param apps.defaults.containerPorts.http HTTP container port
    ##
    containerPorts:
      http: 8080
    ## @param apps.defaults.extraEnvVars Array with extra environment variables
    ## e.g:
    ## extraEnvVars:
    ##   - name: FOO
    ##     value: "bar"
    ##   - name: FEATURE_FLAG
    ##     value: "true"
    ##
    extraEnvVars: []
    ## @param apps.defaults.extraEnvVarsCM Name of existing ConfigMap containing extra env vars
    ##
    extraEnvVarsCM: ""
    ## @param apps.defaults.extraEnvVarsSecret Name of existing Secret containing extra env vars
    ##
    extraEnvVarsSecret: ""
    ## @param apps.defaults.extraVolumes Optionally specify additional pod volumes
    ## e.g:
    ## extraVolumes:
    ##   - name: app-cache
    ##     emptyDir: {}
    ##
    extraVolumes: []
    ## @param apps.defaults.extraVolumeMounts Optionally specify additional container volumeMounts
    ## e.g:
    ## extraVolumeMounts:
    ##   - name: app-cache
    ##     mountPath: /var/cache/app
    ##
    extraVolumeMounts: []
    ## @param apps.defaults.sidecars Additional sidecar containers for pods
    ## e.g:
    ## sidecars:
    ##   - name: log-shipper
    ##     image: busybox:1.36
    ##     command: ["/bin/sh", "-c", "tail -f /var/log/app.log"]
    ##
    sidecars: []
    ## @param apps.defaults.initContainers Additional init containers for pods
    ## e.g:
    ## initContainers:
    ##   - name: init-permissions
    ##     image: busybox:1.36
    ##     command: ["sh", "-c", "chown -R 1001:1001 /data"]
    ##
    initContainers: []
    ## Configure liveness probe
    ## @param apps.defaults.livenessProbe.enabled Enable livenessProbe
    ## @param apps.defaults.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
    ## @param apps.defaults.livenessProbe.periodSeconds Period seconds for livenessProbe
    ## @param apps.defaults.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
    ## @param apps.defaults.livenessProbe.failureThreshold Failure threshold for livenessProbe
    ## @param apps.defaults.livenessProbe.successThreshold Success threshold for livenessProbe
    ##
    livenessProbe:
      enabled: false
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 1
      failureThreshold: 3
      successThreshold: 1
    ## Configure readiness probe
    ## @param apps.defaults.readinessProbe.enabled Enable readinessProbe
    ## @param apps.defaults.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
    ## @param apps.defaults.readinessProbe.periodSeconds Period seconds for readinessProbe
    ## @param apps.defaults.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
    ## @param apps.defaults.readinessProbe.failureThreshold Failure threshold for readinessProbe
    ## @param apps.defaults.readinessProbe.successThreshold Success threshold for readinessProbe
    ##
    readinessProbe:
      enabled: true
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 1
      failureThreshold: 3
      successThreshold: 1
    ## Configure startup probe
    ## @param apps.defaults.startupProbe.enabled Enable startupProbe
    ## @param apps.defaults.startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
    ## @param apps.defaults.startupProbe.periodSeconds Period seconds for startupProbe
    ## @param apps.defaults.startupProbe.timeoutSeconds Timeout seconds for startupProbe
    ## @param apps.defaults.startupProbe.failureThreshold Failure threshold for startupProbe
    ## @param apps.defaults.startupProbe.successThreshold Success threshold for startupProbe
    ##
    startupProbe:
      enabled: false
      initialDelaySeconds: 15
      periodSeconds: 5
      timeoutSeconds: 1
      failureThreshold: 60
      successThreshold: 1
    ## @param apps.defaults.customLivenessProbe Custom livenessProbe that overrides the default
    ## e.g:
    ## customLivenessProbe:
    ##   httpGet:
    ##     path: /livez
    ##     port: http
    ##   initialDelaySeconds: 10
    ##   periodSeconds: 10
    ##
    customLivenessProbe: {}
    ## @param apps.defaults.customReadinessProbe Custom readinessProbe that overrides the default
    ## e.g:
    ## customReadinessProbe:
    ##   httpGet:
    ##     path: /readyz
    ##     port: http
    ##   initialDelaySeconds: 5
    ##   periodSeconds: 5
    ##
    customReadinessProbe: {}
    ## @param apps.defaults.customStartupProbe Custom startupProbe that overrides the default
    ## e.g:
    ## customStartupProbe:
    ##   httpGet:
    ##     path: /startupz
    ##     port: http
    ##   failureThreshold: 60
    ##   periodSeconds: 5
    ##
    customStartupProbe: {}
    ## Pod Disruption Budget configuration
    ## ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb
    ##
    pdb:
      ## @param apps.defaults.pdb.create Enable/disable PodDisruptionBudget creation
      ##
      create: false
      ## @param apps.defaults.pdb.minAvailable Minimum number/percentage of pods that should remain scheduled
      ## e.g: 1, "50%"
      ##
      minAvailable: 1
      ## @param apps.defaults.pdb.maxUnavailable Maximum number/percentage of pods that may be unavailable
      ## e.g: 1, "25%"
      ##
      maxUnavailable: ""
    ## Autoscaling configuration
    ## ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
    ##
    autoscaling:
      hpa:
        ## @param apps.defaults.autoscaling.hpa.enabled Enable HPA
        ##
        enabled: false
        ## @param apps.defaults.autoscaling.hpa.minReplicas Minimum number of replicas
        ##
        minReplicas: ""
        ## @param apps.defaults.autoscaling.hpa.maxReplicas Maximum number of replicas
        ##
        maxReplicas: ""
        ## @param apps.defaults.autoscaling.hpa.targetCPU Target CPU utilization percentage
        ##
        targetCPU: ""
        ## @param apps.defaults.autoscaling.hpa.targetMemory Target memory utilization percentage
        ##
        targetMemory: ""
      vpa:
        ## @param apps.defaults.autoscaling.vpa.enabled Enable VPA
        ##
        enabled: false
        ## @param apps.defaults.autoscaling.vpa.annotations Annotations for VPA resource
        ## e.g:
        ## annotations:
        ##   goldilocks.fairwinds.com/enabled: "true"
        ##
        annotations: {}
        ## @param apps.defaults.autoscaling.vpa.controlledResources VPA resources that the autoscaler can control
        ## e.g: ["cpu", "memory"]
        ##
        controlledResources: []
        ## @param apps.defaults.autoscaling.vpa.maxAllowed VPA max allowed resources for the pod
        ## e.g:
        ## maxAllowed:
        ##   cpu: "2"
        ##   memory: 2Gi
        ##
        maxAllowed: {}
        ## @param apps.defaults.autoscaling.vpa.minAllowed VPA min allowed resources for the pod
        ## e.g:
        ## minAllowed:
        ##   cpu: 100m
        ##   memory: 128Mi
        ##
        minAllowed: {}
        ## VPA update policy
        ##
        updatePolicy:
          ## @param apps.defaults.autoscaling.vpa.updatePolicy.updateMode VPA update policy mode (Off, Initial, Recreate, Auto)
          ##
          updateMode: Auto
    ## Service parameters
    ## ref: https://kubernetes.io/docs/concepts/services-networking/service/
    ##
    service:
      ## @param apps.defaults.service.type Service type
      ##
      type: ClusterIP
      ## @param apps.defaults.service.ports.http HTTP service port
      ##
      ports:
        http: 80
      ## @param apps.defaults.service.nodePorts.http NodePort for HTTP (if NodePort/LoadBalancer)
      ## NOTE: choose port between <30000-32767>
      ##
      nodePorts:
        http: ""
      ## @param apps.defaults.service.clusterIP Service ClusterIP
      ## e.g: None
      ##
      clusterIP: ""
      ## @param apps.defaults.service.loadBalancerIP Service LoadBalancer IP
      ##
      loadBalancerIP: ""
      ## @param apps.defaults.service.loadBalancerSourceRanges Service LoadBalancer allowed source ranges
      ## e.g:
      ## loadBalancerSourceRanges:
      ##   - 10.10.10.0/24
      ##   - 192.168.0.0/16
      ##
      loadBalancerSourceRanges: []
      ## @param apps.defaults.service.externalTrafficPolicy Service external traffic policy
      ##
      externalTrafficPolicy: Cluster
      ## @param apps.defaults.service.annotations Service annotations
      ##
      annotations: {}
      ## @param apps.defaults.service.extraPorts Extra service ports
      ##
      extraPorts: []
      ## @param apps.defaults.service.sessionAffinity Session affinity mode
      ##
      sessionAffinity: None
      ## @param apps.defaults.service.sessionAffinityConfig Extra sessionAffinity settings
      ## e.g:
      ## sessionAffinityConfig:
      ##   clientIP:
      ##     timeoutSeconds: 300
      ##
      sessionAffinityConfig: {}
    ## Network Policies
    ## Ref: https://kubernetes.io/docs/concepts/services-networking/network-policies/
    ##
    networkPolicy:
      ## @param apps.defaults.networkPolicy.enabled Specifies whether a NetworkPolicy should be created
      ##
      enabled: true
      ## @param apps.defaults.networkPolicy.allowExternal Allow connections from any source on matching destination ports
      ##
      allowExternal: true
      ## @param apps.defaults.networkPolicy.allowExternalEgress Allow egress to any destination/port
      ##
      allowExternalEgress: true
      ## @param apps.defaults.networkPolicy.addExternalClientAccess Allow pods with client label set to true
      ##
      addExternalClientAccess: true
      ## @param apps.defaults.networkPolicy.extraIngress Add extra ingress rules
      ## e.g:
      ## extraIngress:
      ##   - ports:
      ##       - port: 1234
      ##     from:
      ##       - podSelector:
      ##           matchLabels:
      ##             role: frontend
      ##
      extraIngress: []
      ## @param apps.defaults.networkPolicy.extraEgress Add extra egress rules
      ## e.g:
      ## extraEgress:
      ##   - ports:
      ##       - port: 1234
      ##     to:
      ##       - podSelector:
      ##           matchLabels:
      ##             role: backend
      ##
      extraEgress: []
      ## @param apps.defaults.networkPolicy.ingressPodMatchLabels Pod labels to allow ingress from
      ## e.g:
      ## ingressPodMatchLabels:
      ##   my-client: "true"
      ##
      ingressPodMatchLabels: {}
      ## @param apps.defaults.networkPolicy.ingressNSMatchLabels Namespace labels to allow ingress from
      ## e.g:
      ## ingressNSMatchLabels:
      ##   kubernetes.io/metadata.name: ingress
      ##
      ingressNSMatchLabels: {}
      ## @param apps.defaults.networkPolicy.ingressNSPodMatchLabels Pod labels (within matched namespaces) to allow ingress from
      ## e.g:
      ## ingressNSPodMatchLabels:
      ##   app: ingress-nginx
      ##
      ingressNSPodMatchLabels: {}

  config:
    web:
      enabled: true
      role: webserver
      portEnvVarName: hazel_WEBSERVER_PORT_NUMBER
      image:
        repository: ghcr.io/hazelchat/hazel-web
        tag: "1.0.1"
        pullPolicy: IfNotPresent

    cluster:
      enabled: true
      role: cluster
      portEnvVarName: hazel_CLUSTER_PORT_NUMBER
      image:
        repository: ghcr.io/hazelchat/hazel-cluster
        tag: "1.0.1"
        pullPolicy: IfNotPresent

    docs:
      enabled: true
      role: docs
      portEnvVarName: hazel_DOCS_PORT_NUMBER
      image:
        repository: ghcr.io/hazelchat/hazel-docs
        tag: "1.0.1"
        pullPolicy: IfNotPresent

    botgateway:
      enabled: true
      role: botgateway
      portEnvVarName: hazel_BOTGATEWAY_PORT_NUMBER
      image:
        repository: ghcr.io/hazelchat/hazel-bot-gateway
        tag: "1.0.1"
        pullPolicy: IfNotPresent

botgateway:
  localRoutes: ["/"]
docs:
  localRoutes: ["/"]
cluster:
  localRoutes: ["/"]
backend:
  enabled: true
  replicas: 1

  # command: []
  # args: []
  diagnosticMode:
    enabled: false

  host: backend.hazel.localhost
  existingTlsSecretName: ""  # if set, will use this TLS secret directly
  # should match one of the cert-manager issuers above if using builtin cert-manager
  tlsIssuerName: "letsencrypt-staging"
  tlsIssuerKind: "Issuer"

  application:
    name: backend
    port: 8000
    maxRequests: 1000
  service:
    name: backend
    port: 8000
  localRoutes: ["/"]

  image:
    repository: ghcr.io/hazelchat/hazel-backend
    tag: "1.0.1"
    pullPolicy: IfNotPresent
    pullSecrets: []

electricProxy:
  localRoutes: ["/"]
landing:
  localRoutes: ["/"]
actors:
  localRoutes: ["/"]
# SMTP settings
smtp:
  host: smtp.hazel.localhost
  port: 2525
  useTLS: "false"
  useSSL: "false"
  credentials:
    username:
      # set secretName to "" to disable SMTP auth
      secretName: smtp-credentials
      secretKey: username
    password:
      # set secretName to "" to disable SMTP auth
      secretName: smtp-credentials
      secretKey: password

# Backups and Init
# Init job to setup the platform - MUST be launched manually, see `README` for more info!
init:
  enabled: false
  workflow:
    timeout: 3600  # 1 hour in seconds

backups:
  # image:
  #   repository: minio/mc
  #   tag: RELEASE.2025-08-13T08-35-41Z
  #   pullPolicy: IfNotPresent

  media:
    enabled: false
    strategy:
      type: Recreate
    destination:
      bucketName: "hazel-storage"
      host: backups.hazel.localhost
      port: 80
      useSSL: false
      accessKey:
        secretName: s3-backups
        secretKey: username
      secretKey:
        secretName: s3-backups
        secretKey: password

# Ingress, Certs
traefik:
  enabled: true

publicStoragePaths:
  - /public/

# dbs, search and data stores
cache:
  backend:
    host: redis
    port: 6379
    db: 1
    credentials: "kv-db-credentials"
s3:
  storageBucket: "local/hazel"

  accessKey:
    secretName: s3-storage
    secretKey: username
  secretKey:
    secretName: s3-storage
    secretKey: password

  queryStringAuth: true
  signatureVersion: "s3v4"
  requestChecksumCalculation: "when_required"
  host: files.hazel.localhost
  port: 443
  useSSL: true
  s3CustomDomain: ""
  defaultACL: ""
  addressingStyle: "auto"
  region: ""
db:
  host: db-cluster-rw
  port: 5432
  name: app
  credentials: "hazel-db-credentials"
  options: {}
kv:
  host: kv-rw
  port: 6379
  name: app
  credentials: "kv-db-credentials"
  options: {}
workos:
  cookieDomain: "localhost"
  redirectUri: "http://localhost:3003/auth/callback"
  clientId:
    secretName: workos-credentials
    secretKey: clientId
  apiKey:
    secretName: workos-credentials
    secretKey: apiKey
  webhook:
    secretName: workos-credentials
    secretKey: webhook
integration:
  encryptionKey:
    secretName: integration-encryption-key
    secretKey: key
    version: 1

electric:
  enabled: true
  name: electric
  apiTokenSecretName: electric-api-token
  apiTokenSecretKey: token
  insecureApi: false
  tcpSendTimeout: "600s"

  image:
    repository: electricsql/electric
    tag: 1.4.13
    pullPolicy: IfNotPresent
  podAnnotations: {}
  replicaCount: 1
  extraEnvVars: {}
  strategy:
    type: Recreate

  containerPorts:
    http: 80

  persistence:
    ## @param electric.persistence.enabled Enable electric data persistence using PVC
    ##
    enabled: true
    ## @param electric.persistence.volumeName Name to assign the volume
    ##
    volumeName: "data"
    ## @param electric.persistence.existingClaim Name of an existing PVC to use
    ##
    existingClaim: ""
    ## @param electric.persistence.mountPath The path the volume will be mounted at
    ## Note: useful when using custom electric images
    ##
    mountPath: /var/lib/electric/persistent
    ## @param electric.persistence.subPath The subdirectory of the volume to mount to
    ## Useful in dev environments and one PV for multiple services
    ##
    subPath: ""
    ## @param electric.persistence.storageClass PVC Storage Class for electric data volume
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    ## If undefined (the default) or set to null, no storageClassName spec is
    ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
    ##   GKE, AWS & OpenStack)
    ##
    storageClass: ""
    ## @param electric.persistence.accessModes PVC Access Mode for electric volume
    ##
    accessModes:
      - ReadWriteOnce
    ## @param electric.persistence.size PVC Storage Request for electric volume
    ##
    size: 8Gi
    ## @param electric.persistence.annotations Annotations for the PVC
    ##
    annotations: {}
    ## @param electric.persistence.labels Labels for the PVC
    ##
    labels: {}
    ## @param electric.persistence.selector Selector to match an existing Persistent Volume (this value is evaluated as a template)
    ## selector:
    ##   matchLabels:
    ##     app: my-app
    ##
    selector: {}
    ## @param electric.persistence.dataSource Custom PVC data source
    ##
    dataSource: {}

  ## TODO: document
  service:
    annotations: {}
    labels: {}
      # "istio.io/use-waypoint": "supabase-waypoint"

    type: ClusterIP
    ports:
      http: 80
    nodePorts:
      http: ""
    clusterIP: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    externalTrafficPolicy: Cluster
    extraPorts: []
    sessionAffinity: None
    sessionAffinityConfig: {}

  extraArgs: {}

## @section Default Init Container Parameters
##
defaultInitContainers:
  ## 'wait-for-db' init container parameters
  ##
  waitForDB:
    ## @param defaultInitContainers.waitForDB.enabled Enable init container that waits for the Database to be available
    ##
    enabled: true
    ## Init container's resource requests and limits
    ## ref: http://kubernetes.io/docs/concepts/configuration/manage-compute-resources-container/
    ## @param defaultInitContainers.waitForDB.resourcesPreset Set init container resources according to one common preset (allowed values: none, nano, small, medium, large, xlarge, 2xlarge). This is ignored if waitForDB.resources is set (waitForDB.resources is recommended for production).
    ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
    ##
    resourcesPreset: "none"
    ## @param defaultInitContainers.waitForDB.resources Set init container requests and limits for different resources like CPU or memory (essential for production workloads)
    ## Example:
    ## resources:
    ##   requests:
    ##     cpu: 2
    ##     memory: 512Mi
    ##   limits:
    ##     cpu: 3
    ##     memory: 1024Mi
    ##
    resources: {}
    ## InitContainer Security Context
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
    ## @param defaultInitContainers.waitForDB.containerSecurityContext.enabled Enabled wait-for-db initcontainer's Security Context
    ## @param defaultInitContainers.waitForDB.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in wait-for-db initcontainer
    ## @param defaultInitContainers.waitForDB.containerSecurityContext.runAsUser Set runAsUser in wait-for-db initcontainer's Security Context
    ## @param defaultInitContainers.waitForDB.containerSecurityContext.runAsGroup Set runAsGroup in wait-for-db initcontainer's Security Context
    ## @param defaultInitContainers.waitForDB.containerSecurityContext.runAsNonRoot Set runAsNonRoot in wait-for-db initcontainer's Security Context
    ## @param defaultInitContainers.waitForDB.containerSecurityContext.readOnlyRootFilesystem Set readOnlyRootFilesystem in wait-for-db initcontainer's Security Context
    ## @param defaultInitContainers.waitForDB.containerSecurityContext.privileged Set privileged in wait-for-db initcontainer's Security Context
    ## @param defaultInitContainers.waitForDB.containerSecurityContext.allowPrivilegeEscalation Set allowPrivilegeEscalation in wait-for-db initcontainer's Security Context
    ## @param defaultInitContainers.waitForDB.containerSecurityContext.capabilities.drop List of capabilities to be dropped in wait-for-db initcontainer
    ## @param defaultInitContainers.waitForDB.containerSecurityContext.seccompProfile.type Set seccomp profile in wait-for-db initcontainer
    ##
    containerSecurityContext:
      enabled: true
      seLinuxOptions: {}
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      readOnlyRootFilesystem: false
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: "RuntimeDefault"

  ## 'wait-for-kv' init container parameters
  ##
  waitForKV:
    ## @param defaultInitContainers.waitForRedis.enabled Enable init container that waits for Redis to be available
    ##
    enabled: true
    ## Init container's resource requests and limits
    ## ref: http://kubernetes.io/docs/concepts/configuration/manage-compute-resources-container/
    ## @param defaultInitContainers.waitForRedis.resourcesPreset Set init container resources according to one common preset (allowed values: none, nano, small, medium, large, xlarge, 2xlarge). This is ignored if waitForRedis.resources is set (waitForRedis.resources is recommended for production).
    ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
    ##
    resourcesPreset: "none"
    ## @param defaultInitContainers.waitForRedis.resources Set init container requests and limits for different resources like CPU or memory (essential for production workloads)
    ## Example:
    ## resources:
    ##   requests:
    ##     cpu: 2
    ##     memory: 512Mi
    ##   limits:
    ##     cpu: 3
    ##     memory: 1024Mi
    ##
    resources: {}
    ## InitContainer Security Context
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
    ## @param defaultInitContainers.waitForRedis.containerSecurityContext.enabled Enabled wait-for-redis initcontainer's Security Context
    ## @param defaultInitContainers.waitForRedis.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in wait-for-redis initcontainer
    ## @param defaultInitContainers.waitForRedis.containerSecurityContext.runAsUser Set runAsUser in wait-for-redis initcontainer's Security Context
    ## @param defaultInitContainers.waitForRedis.containerSecurityContext.runAsGroup Set runAsGroup in wait-for-redis initcontainer's Security Context
    ## @param defaultInitContainers.waitForRedis.containerSecurityContext.runAsNonRoot Set runAsNonRoot in wait-for-redis initcontainer's Security Context
    ## @param defaultInitContainers.waitForRedis.containerSecurityContext.readOnlyRootFilesystem Set readOnlyRootFilesystem in wait-for-redis initcontainer's Security Context
    ## @param defaultInitContainers.waitForRedis.containerSecurityContext.privileged Set privileged in wait-for-redis initcontainer's Security Context
    ## @param defaultInitContainers.waitForRedis.containerSecurityContext.allowPrivilegeEscalation Set allowPrivilegeEscalation in wait-for-redis initcontainer's Security Context
    ## @param defaultInitContainers.waitForRedis.containerSecurityContext.capabilities.drop List of capabilities to be dropped in wait-for-redis initcontainer
    ## @param defaultInitContainers.waitForRedis.containerSecurityContext.seccompProfile.type Set seccomp profile in wait-for-redis initcontainer
    ##
    containerSecurityContext:
      enabled: true
      seLinuxOptions: {}
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      readOnlyRootFilesystem: false
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: "RuntimeDefault"


