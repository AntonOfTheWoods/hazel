
global:
  instanceId: "hazel-instance"
  imagePullSecrets: []
  namespace: hazel
  hazelVersion: "1.0.1"
  redirectHttp: true

psqlImage:
  # should already be in the cluster from the db cluster setup, so no need to pull
  # ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
  registry: docker.io
  repository: postgres
  tag: 18-alpine
  pullPolicy: IfNotPresent

project:
  local:
    enableNodePorts: false

# Common labels and annotations
commonLabels:
  app.kubernetes.io/part-of: hazel
  # app.kubernetes.io/managed-by: Helm
  # Additional common labels can be added here

commonAnnotations: {}
  # App version annotation will be automatically added
  # Additional annotations can be added here

hazel:
  # Dev settings
  isDev: false
  local:
    # if set and `isDev: true`, will mount a volume from this path (useful for local development)
    # WARNING: this path will be inside the k3d container if using k3d, not your host machine,
    # so if you want to use your host machine path, you need to mount it in k3d first at cluster creation time!
    # This will be done automatically if using the kube scripts
    src: true

## hazel Webserver
##
web:
  enabled: true
  localRoutes:
    - name: root
      path: /
      # suppressPath: false
      port: 8000

  image:
    repository: ghcr.io/hazelchat/hazel-web
    tag: "1.0.1"
    pullPolicy: IfNotPresent
    pullSecrets: []

  # application:
  #   name: web
  #   port: 8000
  # service:
  #   name: web
  #   port: 8000

  ingress:
    profileUpload:
      maxRequestBodyBytes: 1048576  # 1MB
      memRequestBodyBytes: 1048576
      maxResponseBodyBytes: 0
    default:
      maxRequestBodyBytes: 4194304  # 4MB
      memRequestBodyBytes: 4194304
      maxResponseBodyBytes: 0


  ## @param web.replicaCount Number of hazel webserver replicas to deploy
  ##
  replicaCount: 1
  ## @param web.containerPorts.http hazel webserver HTTP container port
  ##
  containerPorts:
    http: 8080
  ## @param web.extraContainerPorts Optionally specify extra list of additional ports for WordPress container(s)
  ## e.g:
  ## extraContainerPorts:
  ##   - name: myservice
  ##     containerPort: 9090
  ##
  extraContainerPorts: []
  ## Configure extra options for hazel webserver containers' liveness and readiness probes
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
  ## @param web.livenessProbe.enabled Enable livenessProbe on hazel webserver containers
  ## @param web.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  ## @param web.livenessProbe.periodSeconds Period seconds for livenessProbe
  ## @param web.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  ## @param web.livenessProbe.failureThreshold Failure threshold for livenessProbe
  ## @param web.livenessProbe.successThreshold Success threshold for livenessProbe
  ##
  livenessProbe:
    enabled: false
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  ## @param web.readinessProbe.enabled Enable readinessProbe on hazel webserver containers
  ## @param web.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  ## @param web.readinessProbe.periodSeconds Period seconds for readinessProbe
  ## @param web.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  ## @param web.readinessProbe.failureThreshold Failure threshold for readinessProbe
  ## @param web.readinessProbe.successThreshold Success threshold for readinessProbe
  ##
  readinessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  ## @param web.startupProbe.enabled Enable startupProbe on hazel webserver containers
  ## @param web.startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
  ## @param web.startupProbe.periodSeconds Period seconds for startupProbe
  ## @param web.startupProbe.timeoutSeconds Timeout seconds for startupProbe
  ## @param web.startupProbe.failureThreshold Failure threshold for startupProbe
  ## @param web.startupProbe.successThreshold Success threshold for startupProbe
  ##
  startupProbe:
    enabled: false
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 60
    successThreshold: 1
  ## @param web.customLivenessProbe Custom livenessProbe that overrides the default one
  ##
  customLivenessProbe: {}
  ## @param web.customReadinessProbe Custom readinessProbe that overrides the default one
  ##
  customReadinessProbe: {}
  ## @param web.customStartupProbe Custom startupProbe that overrides the default one
  ##
  customStartupProbe: {}
  ## hazel webserver resource requests and limits
  ## ref: http://kubernetes.io/docs/concepts/configuration/manage-compute-resources-container/
  ## @param web.resourcesPreset Set hazel webserver container resources according to one common preset (allowed values: none, nano, small, medium, large, xlarge, 2xlarge). This is ignored if web.resources is set (web.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "none"
  ## @param web.resources Set hazel webserver container requests and limits for different resources like CPU or memory (essential for production workloads)
  ## Example:
  ## resources:
  ##   requests:
  ##     cpu: 2
  ##     memory: 512Mi
  ##   limits:
  ##     cpu: 3
  ##     memory: 1024Mi
  ##
  resources: {}
  ## Configure Pods Security Context
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
  ## @param web.podSecurityContext.enabled Enable hazel webserver pods' Security Context
  ## @param web.podSecurityContext.fsGroupChangePolicy Set filesystem group change policy for hazel webserver pods
  ## @param web.podSecurityContext.sysctls Set kernel settings using the sysctl interface for hazel webserver pods
  ## @param web.podSecurityContext.supplementalGroups Set filesystem extra groups for hazel webserver pods
  ## @param web.podSecurityContext.fsGroup Set fsGroup in hazel webserver pods' Security Context
  ##
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
    fsGroup: 1001
  ## Configure Container Security Context
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
  ## @param web.containerSecurityContext.enabled Enabled hazel webserver container' Security Context
  ## @param web.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in hazel webserver container
  ## @param web.containerSecurityContext.runAsUser Set runAsUser in hazel webserver container' Security Context
  ## @param web.containerSecurityContext.runAsGroup Set runAsGroup in hazel webserver container' Security Context
  ## @param web.containerSecurityContext.runAsNonRoot Set runAsNonRoot in hazel webserver container' Security Context
  ## @param web.containerSecurityContext.readOnlyRootFilesystem Set readOnlyRootFilesystem in hazel webserver container' Security Context
  ## @param web.containerSecurityContext.privileged Set privileged in hazel webserver container' Security Context
  ## @param web.containerSecurityContext.allowPrivilegeEscalation Set allowPrivilegeEscalation in hazel webserver container' Security Context
  ## @param web.containerSecurityContext.capabilities.drop List of capabilities to be dropped in hazel webserver container
  ## @param web.containerSecurityContext.seccompProfile.type Set seccomp profile in hazel webserver container
  ##
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    readOnlyRootFilesystem: false
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: "RuntimeDefault"
  ## @param web.command Override default hazel webserver container command (useful when using custom images)
  ##
  command: []
  ## @param web.args Override default hazel webserver container args (useful when using custom images)
  ##
  args: []
  ## @param web.automountServiceAccountToken Mount Service Account token in hazel webserver pods
  ##
  automountServiceAccountToken: false
  ## @param web.hostAliases hazel webserver pods host aliases
  ## https://kubernetes.io/docs/concepts/services-networking/add-entries-to-pod-etc-hosts-with-host-aliases/
  ##
  hostAliases: []
  ## @param web.deploymentAnnotations Annotations for hazel webserver deployment
  ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  ##
  deploymentAnnotations: {}
  ## @param web.podLabels Extra labels for hazel webserver pods
  ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  ##
  podLabels: {}
  ## @param web.podAnnotations Annotations for hazel webserver pods
  ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  ##
  podAnnotations: {}
  ## @param web.podAffinityPreset Pod affinity preset. Ignored if `web.affinity` is set. Allowed values: `soft` or `hard`
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
  ##
  podAffinityPreset: ""
  ## @param web.podAntiAffinityPreset Pod anti-affinity preset. Ignored if `web.affinity` is set. Allowed values: `soft` or `hard`
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
  ##
  podAntiAffinityPreset: soft
  ## Node web.affinity preset
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
  ##
  nodeAffinityPreset:
    ## @param web.nodeAffinityPreset.type Node affinity preset type. Ignored if `web.affinity` is set. Allowed values: `soft` or `hard`
    ##
    type: ""
    ## @param web.nodeAffinityPreset.key Node label key to match. Ignored if `web.affinity` is set
    ##
    key: ""
    ## @param web.nodeAffinityPreset.values Node label values to match. Ignored if `web.affinity` is set
    ## E.g.
    ## values:
    ##   - e2e-az1
    ##   - e2e-az2
    ##
    values: []
  ## @param web.affinity Affinity for hazel webserver pods assignment
  ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  ## NOTE: `web.podAffinityPreset`, `web.podAntiAffinityPreset`, and `web.nodeAffinityPreset` will be ignored when it's set
  ##
  affinity: {}
  ## @param web.nodeSelector Node labels for hazel webserver pods assignment
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
  ##
  nodeSelector: {}
  ## @param web.tolerations Tolerations for hazel webserver pods assignment
  ## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  ##
  tolerations: []
  ## @param web.updateStrategy.type hazel webserver deployment strategy type
  ## ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  ##
  updateStrategy:
    ## Can be set to RollingUpdate or Recreate
    ##
    type: RollingUpdate
  ## @param web.priorityClassName hazel webserver pods' priorityClassName
  ##
  priorityClassName: ""
  ## @param web.topologySpreadConstraints Topology Spread Constraints for hazel webserver pod assignment spread across your cluster among failure-domains
  ## Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/#spread-constraints-for-pods
  ##
  topologySpreadConstraints: []
  ## @param web.schedulerName Name of the k8s scheduler (other than default) for hazel webserver pods
  ## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
  ##
  schedulerName: ""
  ## @param web.terminationGracePeriodSeconds Seconds hazel webserver pods need to terminate gracefully
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod/#termination-of-pods
  ##
  terminationGracePeriodSeconds: ""
  ## @param web.lifecycleHooks for hazel webserver containers to automate configuration before or after startup
  ##
  lifecycleHooks: {}
  ## @param web.extraEnvVars Array with extra environment variables to add to hazel webserver containers
  ## e.g:
  ## extraEnvVars:
  ##   - name: FOO
  ##     value: "bar"
  ##
  extraEnvVars: []
  ## @param web.extraEnvVarsCM Name of existing ConfigMap containing extra env vars for hazel webserver containers
  ##
  extraEnvVarsCM: ""
  ## @param web.extraEnvVarsSecret Name of existing Secret containing extra env vars for hazel webserver containers
  ##
  extraEnvVarsSecret: ""
  ## @param web.extraVolumes Optionally specify extra list of additional volumes for the hazel webserver pods
  ##
  extraVolumes: []
  ## @param web.extraVolumeMounts Optionally specify extra list of additional volumeMounts for the hazel webserver containers
  ##
  extraVolumeMounts: []
  ## @param web.sidecars Add additional sidecar containers to the hazel webserver pods
  ## e.g:
  ## sidecars:
  ##   - name: your-image-name
  ##     image: your-image
  ##     imagePullPolicy: Always
  ##     ports:
  ##       - name: portname
  ##         containerPort: 1234
  ##
  sidecars: []
  ## @param web.initContainers Add additional init containers to the hazel webserver pods
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  ## e.g:
  ## initContainers:
  ##  - name: your-image-name
  ##    image: your-image
  ##    imagePullPolicy: Always
  ##    command: ['sh', '-c', 'echo "hello world"']
  ##
  initContainers: []
  ## Pod Disruption Budget configuration
  ## ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb
  ## @param web.pdb.create Enable/disable a Pod Disruption Budget creation
  ## @param web.pdb.minAvailable Minimum number/percentage of pods that should remain scheduled
  ## @param web.pdb.maxUnavailable Maximum number/percentage of pods that may be made unavailable
  ##
  pdb:
    create: false
    minAvailable: 1
    maxUnavailable: ""
  ## Autoscaling configuration
  ## ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
  autoscaling:
    vpa:
      ## @param web.autoscaling.vpa.enabled Enable VPA
      ##
      enabled: false
      ## @param web.autoscaling.vpa.annotations Annotations for VPA resource
      ##
      annotations: {}
      ## @param web.autoscaling.vpa.controlledResources VPA List of resources that the vertical pod autoscaler can control. Defaults to cpu and memory
      ##
      controlledResources: []
      ## @param web.autoscaling.vpa.maxAllowed VPA Max allowed resources for the pod
      ## cpu: 200m
      ## memory: 100Mi
      maxAllowed: {}
      ## @param web.autoscaling.vpa.minAllowed VPA Min allowed resources for the pod
      ## cpu: 200m
      ## memory: 100Mi
      minAllowed: {}
      ## VPA update policy
      ##
      updatePolicy:
        ## @param web.autoscaling.vpa.updatePolicy.updateMode Autoscaling update policy Specifies whether recommended updates are applied when a Pod is started and whether recommended updates are applied during the life of a Pod
        ## Possible values are "Off", "Initial", "Recreate", and "Auto".
        ##
        updateMode: Auto
    hpa:
      ## @param web.autoscaling.hpa.enabled Enable HPA
      ##
      enabled: false
      ## @param web.autoscaling.hpa.minReplicas Minimum number of replicas
      ##
      minReplicas: ""
      ## @param web.autoscaling.hpa.maxReplicas Maximum number of replicas
      ##
      maxReplicas: ""
      ## @param web.autoscaling.hpa.targetCPU Target CPU utilization percentage
      ##
      targetCPU: ""
      ## @param web.autoscaling.hpa.targetMemory Target Memory utilization percentage
      ##
      targetMemory: ""

  ## hazel webserver service parameters
  ##
  service:
    ## @param web.service.type hazel webserver service type
    ##
    type: LoadBalancer
    ## @param web.service.ports.http hazel webserver service HTTP port
    ##
    ports:
      http: 80
    ## Node ports to expose
    ## @param web.service.nodePorts.http Node port for HTTP
    ## NOTE: choose port between <30000-32767>
    ##
    nodePorts:
      http: ""
    ## @param web.service.clusterIP hazel webserver service Cluster IP
    ## e.g.:
    ## clusterIP: None
    ##
    clusterIP: ""
    ## @param web.service.loadBalancerIP hazel webserver service Load Balancer IP
    ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-loadbalancer
    ##
    loadBalancerIP: ""
    ## @param web.service.loadBalancerSourceRanges hazel webserver service Load Balancer sources
    ## ref: https://kubernetes.io/docs/tasks/access-application-cluster/configure-cloud-provider-firewall/#restrict-access-for-loadbalancer-service
    ## e.g:
    ## loadBalancerSourceRanges:
    ##   - 10.10.10.0/24
    ##
    loadBalancerSourceRanges: []
    ## @param web.service.externalTrafficPolicy hazel webserver service external traffic policy
    ## ref http://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
    ##
    externalTrafficPolicy: Cluster
    ## @param web.service.annotations Additional custom annotations for hazel webserver service
    ##
    annotations: {}
    ## @param web.service.extraPorts Extra ports to expose in hazel webserver service (normally used with the `sidecars` value)
    ##
    extraPorts: []
    ## @param web.service.sessionAffinity Control where client requests go, to the same pod or round-robin
    ## Values: ClientIP or None
    ## ref: https://kubernetes.io/docs/concepts/services-networking/service/
    ##
    sessionAffinity: None
    ## @param web.service.sessionAffinityConfig Additional settings for the sessionAffinity
    ## sessionAffinityConfig:
    ##   clientIP:
    ##     timeoutSeconds: 300
    ##
    sessionAffinityConfig: {}
  ## Network Policies
  ## Ref: https://kubernetes.io/docs/concepts/services-networking/network-policies/
  ##
  networkPolicy:
    ## @param web.networkPolicy.enabled Specifies whether a NetworkPolicy should be created
    ##
    enabled: true
    ## @param web.networkPolicy.allowExternal Don't require server label for connections
    ## The Policy model to apply. When set to false, only pods with the correct
    ## server label will have network access to the ports server is listening
    ## on. When true, server will accept connections from any source
    ## (with the correct destination port).
    ##
    allowExternal: true
    ## @param web.networkPolicy.allowExternalEgress Allow the pod to access any range of port and all destinations.
    ##
    allowExternalEgress: true
    ## @param web.networkPolicy.addExternalClientAccess Allow access from pods with client label set to "true". Ignored if `networkPolicy.allowExternal` is true.
    ##
    addExternalClientAccess: true
    ## @param web.networkPolicy.extraIngress [array] Add extra ingress rules to the NetworkPolicy
    ## e.g:
    ## extraIngress:
    ##   - ports:
    ##       - port: 1234
    ##     from:
    ##       - podSelector:
    ##           - matchLabels:
    ##               - role: frontend
    ##       - podSelector:
    ##           - matchExpressions:
    ##               - key: role
    ##                 operator: In
    ##                 values:
    ##                   - frontend
    extraIngress: []
    ## @param web.networkPolicy.extraEgress [array] Add extra ingress rules to the NetworkPolicy (ignored if allowExternalEgress=true)
    ## e.g:
    ## extraEgress:
    ##   - ports:
    ##       - port: 1234
    ##     to:
    ##       - podSelector:
    ##           - matchLabels:
    ##               - role: frontend
    ##       - podSelector:
    ##           - matchExpressions:
    ##               - key: role
    ##                 operator: In
    ##                 values:
    ##                   - frontend
    ##
    extraEgress: []
    ## @param web.networkPolicy.ingressPodMatchLabels [object] Labels to match to allow traffic from other pods. Ignored if `networkPolicy.allowExternal` is true.
    ## e.g:
    ## ingressPodMatchLabels:
    ##   my-client: "true"
    #
    ingressPodMatchLabels: {}
    ## @param web.networkPolicy.ingressNSMatchLabels [object] Labels to match to allow traffic from other namespaces
    ## @param web.networkPolicy.ingressNSPodMatchLabels [object] Pod labels to match to allow traffic from other namespaces
    ##
    ingressNSMatchLabels: {}
    ingressNSPodMatchLabels: {}

  ## 'wait-for-examples' init container parameters
  ##
  waitForExamples:
    ## @param web.waitForExamples.enabled Enable init container that waits for the load_examples command to finish before starting the webserver
    ##
    enabled: false
    ## Init container's resource requests and limits
    ## ref: http://kubernetes.io/docs/concepts/configuration/manage-compute-resources-container/
    ## @param web.waitForExamples.resourcesPreset Set init container resources according to one common preset (allowed values: none, nano, small, medium, large, xlarge, 2xlarge). This is ignored if waitForExamples.resources is set (waitForExamples.resources is recommended for production).
    ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
    ##
    resourcesPreset: "nano"
    ## @param web.waitForExamples.resources Set init container requests and limits for different resources like CPU or memory (essential for production workloads)
    ## Example:
    ## resources:
    ##   requests:
    ##     cpu: 2
    ##     memory: 512Mi
    ##   limits:
    ##     cpu: 3
    ##     memory: 1024Mi
    ##
    resources: {}
    ## InitContainer Security Context
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
    ## @param web.waitForExamples.containerSecurityContext.enabled Enabled wait-for-redis initcontainer's Security Context
    ## @param web.waitForExamples.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in wait-for-redis initcontainer
    ## @param web.waitForExamples.containerSecurityContext.runAsUser Set runAsUser in wait-for-redis initcontainer's Security Context
    ## @param web.waitForExamples.containerSecurityContext.runAsGroup Set runAsGroup in wait-for-redis initcontainer's Security Context
    ## @param web.waitForExamples.containerSecurityContext.runAsNonRoot Set runAsNonRoot in wait-for-redis initcontainer's Security Context
    ## @param web.waitForExamples.containerSecurityContext.readOnlyRootFilesystem Set readOnlyRootFilesystem in wait-for-redis initcontainer's Security Context
    ## @param web.waitForExamples.containerSecurityContext.privileged Set privileged in wait-for-redis initcontainer's Security Context
    ## @param web.waitForExamples.containerSecurityContext.allowPrivilegeEscalation Set allowPrivilegeEscalation in wait-for-redis initcontainer's Security Context
    ## @param web.waitForExamples.containerSecurityContext.capabilities.drop List of capabilities to be dropped in wait-for-redis initcontainer
    ## @param web.waitForExamples.containerSecurityContext.seccompProfile.type Set seccomp profile in wait-for-redis initcontainer
    ##
    containerSecurityContext:
      enabled: true
      seLinuxOptions: {}
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      readOnlyRootFilesystem: false
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: "RuntimeDefault"



# web:
#   enabled: true
#   localRoutes:
#     - name: root
#       path: /
#       # suppressPath: false
#       port: 8000
#
#   replicas: 1
#   siteId: 1
#
#   application:
#     name: web
#     port: 8000
#   service:
#     name: web
#     port: 8000
#   ingress:
#     profileUpload:
#       maxRequestBodyBytes: 1048576  # 1MB
#       memRequestBodyBytes: 1048576
#       maxResponseBodyBytes: 0
#     default:
#       maxRequestBodyBytes: 4194304  # 4MB
#       memRequestBodyBytes: 4194304
#       maxResponseBodyBytes: 0
#
#   diagnosticMode:
#     enabled: false
#
#   host: hazel.localhost
#   existingTlsSecretName: ""  # if set, will use this TLS secret directly
#   # should match one of the cert-manager issuers above if using builtin cert-manager
#   tlsIssuerName: "letsencrypt-staging"
#   tlsIssuerKind: "Issuer"
#
#   image:
#     repository: ghcr.io/hazelchat/hazel-web
#     tag: "1.0.1"
#     pullPolicy: IfNotPresent
#     pullSecrets: []

botgateway:
  localRoutes: ["/"]
docs:
  localRoutes: ["/"]
cluster:
  localRoutes: ["/"]
backend:
  enabled: true
  replicas: 1

  # command: []
  # args: []
  diagnosticMode:
    enabled: false

  host: backend.hazel.localhost
  existingTlsSecretName: ""  # if set, will use this TLS secret directly
  # should match one of the cert-manager issuers above if using builtin cert-manager
  tlsIssuerName: "letsencrypt-staging"
  tlsIssuerKind: "Issuer"

  application:
    name: backend
    port: 8000
    maxRequests: 1000
  service:
    name: backend
    port: 8000
  localRoutes: ["/"]

  image:
    repository: ghcr.io/hazelchat/hazel-backend
    tag: "1.0.1"
    pullPolicy: IfNotPresent
    pullSecrets: []

electricProxy:
  localRoutes: ["/"]
landing:
  localRoutes: ["/"]
actors:
  localRoutes: ["/"]
# SMTP settings
smtp:
  host: smtp.hazel.localhost
  port: 2525
  useTLS: "false"
  useSSL: "false"
  credentials:
    username:
      # set secretName to "" to disable SMTP auth
      secretName: smtp-credentials
      secretKey: username
    password:
      # set secretName to "" to disable SMTP auth
      secretName: smtp-credentials
      secretKey: password

# Backups and Init
# Init job to setup the platform - MUST be launched manually, see `README` for more info!
init:
  enabled: false
  workflow:
    timeout: 3600  # 1 hour in seconds

backups:
  # image:
  #   repository: minio/mc
  #   tag: RELEASE.2025-08-13T08-35-41Z
  #   pullPolicy: IfNotPresent

  media:
    enabled: false
    strategy:
      type: Recreate
    destination:
      bucketName: "hazel-storage"
      host: backups.hazel.localhost
      port: 80
      useSSL: false
      accessKey:
        secretName: s3-backups
        secretKey: username
      secretKey:
        secretName: s3-backups
        secretKey: password

# Ingress, Certs
traefik:
  enabled: true
  publicStoragePaths:
    - /public/

# dbs, search and data stores
cache:
  backend:
    host: redis
    port: 6379
    db: 1
    credentials: "kv-db-credentials"
s3:
  storageBucket: "local/hazel"

  accessKey:
    secretName: s3-storage
    secretKey: username
  secretKey:
    secretName: s3-storage
    secretKey: password

  queryStringAuth: true
  signatureVersion: "s3v4"
  requestChecksumCalculation: "when_required"
  host: files.hazel.localhost
  port: 443
  useSSL: true
  s3CustomDomain: ""
  defaultACL: ""
  addressingStyle: "auto"
  region: ""
db:
  host: db-cluster-rw
  port: 5432
  name: app
  credentials: "hazel-db-credentials"
  options: {}
workos:
  cookieDomain: "localhost"
  redirectUri: "http://localhost:3003/auth/callback"
  clientId:
    secretName: workos-credentials
    secretKey: clientId
  apiKey:
    secretName: workos-credentials
    secretKey: apiKey
  webhook:
    secretName: workos-credentials
    secretKey: webhook
integration:
  encryptionKey:
    secretName: integration-encryption-key
    secretKey: key
    version: 1

electric:
  enabled: true
  name: electric
  apiTokenSecretName: electric-api-token
  apiTokenSecretKey: token
  insecureApi: false
  tcpSendTimeout: "600s"

  image:
    repository: electricsql/electric
    tag: 1.4.13
    pullPolicy: IfNotPresent
  podAnnotations: {}
  replicaCount: 1
  extraEnvVars: {}
  strategy:
    type: Recreate

  containerPorts:
    http: 80

  persistence:
    ## @param electric.persistence.enabled Enable electric data persistence using PVC
    ##
    enabled: true
    ## @param electric.persistence.volumeName Name to assign the volume
    ##
    volumeName: "data"
    ## @param electric.persistence.existingClaim Name of an existing PVC to use
    ##
    existingClaim: ""
    ## @param electric.persistence.mountPath The path the volume will be mounted at
    ## Note: useful when using custom electric images
    ##
    mountPath: /var/lib/electric/persistent
    ## @param electric.persistence.subPath The subdirectory of the volume to mount to
    ## Useful in dev environments and one PV for multiple services
    ##
    subPath: ""
    ## @param electric.persistence.storageClass PVC Storage Class for electric data volume
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    ## If undefined (the default) or set to null, no storageClassName spec is
    ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
    ##   GKE, AWS & OpenStack)
    ##
    storageClass: ""
    ## @param electric.persistence.accessModes PVC Access Mode for electric volume
    ##
    accessModes:
      - ReadWriteOnce
    ## @param electric.persistence.size PVC Storage Request for electric volume
    ##
    size: 8Gi
    ## @param electric.persistence.annotations Annotations for the PVC
    ##
    annotations: {}
    ## @param electric.persistence.labels Labels for the PVC
    ##
    labels: {}
    ## @param electric.persistence.selector Selector to match an existing Persistent Volume (this value is evaluated as a template)
    ## selector:
    ##   matchLabels:
    ##     app: my-app
    ##
    selector: {}
    ## @param electric.persistence.dataSource Custom PVC data source
    ##
    dataSource: {}

  ## TODO: document
  service:
    annotations: {}
    labels: {}
      # "istio.io/use-waypoint": "supabase-waypoint"

    type: ClusterIP
    ports:
      http: 80
    nodePorts:
      http: ""
    clusterIP: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    externalTrafficPolicy: Cluster
    extraPorts: []
    sessionAffinity: None
    sessionAffinityConfig: {}

  extraArgs: {}
