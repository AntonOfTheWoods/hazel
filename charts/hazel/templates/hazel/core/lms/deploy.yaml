{{- if and .Values.hazel.enabled .Values.hazel.lms.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms
  annotations:
    {{- include "hazel.annotations" . | nindent 4 }}
  labels:
    {{- include "hazel.componentLabels" (dict "component" "lms" "root" .) | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.hazel.lms.progressDeadlineSeconds | default 600 }}
  replicas: {{ if hasKey .Values.hazel.lms "replicas" }}{{ .Values.hazel.lms.replicas }}{{ else }}1{{ end }}
  revisionHistoryLimit: {{ .Values.hazel.lms.revisionHistoryLimit | default 10 }}

  selector:
    matchLabels:
      {{- include "hazel.componentSelectorLabels" (dict "component" "lms" "root" .) | nindent 6 }}

  {{- if .Values.hazel.lms.updateStrategy }}
  strategy: {{- toYaml .Values.hazel.lms.updateStrategy | nindent 4 }}
  {{- end }}

  template:
    metadata:
      annotations:
        {{- include "hazel.annotations" . | nindent 8 }}
      labels:
        {{- include "hazel.componentLabels" (dict "component" "lms" "root" .) | nindent 8 }}
    spec:
      dnsPolicy: {{ .Values.hazel.lms.dnsPolicy | default "ClusterFirst" }}
      restartPolicy: {{ .Values.hazel.lms.restartPolicy | default "Always" }}
      schedulerName: {{ .Values.hazel.lms.schedulerName | default "default-scheduler" }}
      # securityContext: { toYaml .Values.hazel.lms.securityContext | default (dict) }
      securityContext:
        runAsGroup: 1000
        runAsUser: 1000
      terminationGracePeriodSeconds: {{ .Values.hazel.lms.terminationGracePeriodSeconds | default 30 }}

      {{- include "hazel.imagePullSecrets" . | nindent 6 }}

      {{- if .Values.hazel.isDev }}
      initContainers:
      {{- include "hazel.dev.caInitContainerForComponent" (dict "component" "lms" "root" .) | nindent 6 }}
      {{- end }}

      containers:
      - name: {{ .Values.hazel.lms.application.name | default "lms" }}
        image: {{ include "hazel.image" (dict "component" "lms" "root" .) }}
        imagePullPolicy: {{ include "hazel.imagePullPolicy" (dict "component" "lms" "root" .) }}

        {{- if .Values.hazel.lms.diagnosticMode.enabled }}
        command: {{- include "common.tplvalues.render" (dict "value" .Values.hazel.lms.diagnosticMode.command "context" $) | nindent 10 }}
        {{- else if .Values.hazel.lms.command }}
        command: {{- include "common.tplvalues.render" (dict "value" .Values.hazel.lms.command "context" $) | nindent 10 }}
        {{- else if .Values.hazel.isDev }}
        command:
        - /bin/sh
        - -c
        args:
        - |
          {{- include "hazel.dev.startupScript" . | nindent 10 }}
          exec uwsgi --ini /hazel/uwsgi.ini
        {{- end }}
        {{- if .Values.hazel.lms.diagnosticMode.enabled }}
        args: {{- include "common.tplvalues.render" (dict "value" .Values.hazel.lms.diagnosticMode.args "context" $) | nindent 10 }}
        {{- else if and .Values.hazel.lms.args (not .Values.hazel.isDev) }}
        args: {{- include "common.tplvalues.render" (dict "value" .Values.hazel.lms.args "context" $) | nindent 11 }}
        {{- end }}

        ports:
        - containerPort: {{ .Values.hazel.lms.application.port | default 8000 }}
          protocol: TCP

        # resources:
        #   requests:
        #     memory: 2Gi
        {{- if .Values.hazel.lms.resources }}
        resources: {{- toYaml .Values.hazel.lms.resources | nindent 12 }}
        {{- end }}

        securityContext:
          allowPrivilegeEscalation: false
        terminationMessagePath: {{ .Values.hazel.lms.terminationMessagePath | default "/dev/termination-log" }}
        terminationMessagePolicy: {{ .Values.hazel.lms.terminationMessagePolicy | default "File" }}

        env:
        - name: SERVICE_VARIANT
          value: lms
        - name: DJANGO_SETTINGS_MODULE
          value: lms.envs.tutor.production
        - name: UWSGI_WORKERS
          value: {{ .Values.hazel.lms.uwsgiWorkers | quote }}
        - name: LISTEN_PORT
          value: {{ .Values.hazel.lms.application.port | default 8000 | quote }}

        - name: SITE_ID
          value: {{ .Values.hazel.lms.siteId | quote }}

        {{- include "hazel.common.env" . | nindent 8 }}

        # LMS web specific env vars
        # TODO: decide whether to implement this - probably not
        # - name: DISCOVERY_HOST
        #   value: ""
        - name: INDIGO_ENABLE_DARK_TOGGLE
          value: "True"

        {{- if .Values.hazel.lms.extraEnvVars }}
        {{- include "common.tplvalues.render" (dict "value" .Values.hazel.lms.extraEnvVars "context" $) | nindent 8 }}
        {{- end }}

        volumeMounts:
        {{- include "hazel.common.volumeMounts" . | nindent 8 }}
        {{- include "hazel.dev.volumeMounts" . | nindent 8 }}
        {{- include "hazel.dev.caVolumeMounts" . | nindent 8 }}
        - name: uwsgi-config
          mountPath: /hazel/uwsgi.ini
          subPath: uwsgi.ini

        {{- if .Values.hazel.lms.extraVolumeMounts }}
        {{- include "common.tplvalues.render" (dict "value" .Values.hazel.lms.extraVolumeMounts "context" $) | nindent 8 }}
        {{- end }}

        {{- if .Values.hazel.lms.sidecars }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.hazel.lms.sidecars "context" $) | nindent 8 }}
        {{- end }}

      volumes:
      {{- include "hazel.common.volumes" . | nindent 6 }}
      {{- include "hazel.dev.volumes" . | nindent 6 }}
      {{- include "hazel.dev.caVolumes" . | nindent 6 }}
      - name: uwsgi-config
        configMap:
          name: hazel-uwsgi-config
          defaultMode: 420
          items:
          - key: uwsgi.ini
            path: uwsgi.ini
      {{- if .Values.hazel.lms.extraVolumes }}
      {{- include "common.tplvalues.render" (dict "value" .Values.hazel.lms.extraVolumes "context" $) | nindent 6 }}
      {{- end }}

{{- end -}}
