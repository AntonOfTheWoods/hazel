{{- if and .Values.hazel.enabled .Values.hazel.isDev -}}
#  localRoutes:
#    - name: mypath
#      path: /mypath
#      suppressPath: false
#      port: 5001
{{- $root := . -}}
{{- $sections := list "web" "botgateway" "docs" "cluster" "backend" "electricProxy" "landing" "actors" }}
{{- range $section := $sections }}
{{- $routes := index $root.Values.hazel $section "localRoutes" }}
{{- range $route := $routes }}
{{- if $route.suppressPath }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: stripprefix-{{ $section }}-{{ $route.name }}
spec:
  stripPrefix:
    prefixes:
      - {{ $route.path }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: external-{{ $section }}-{{ $route.name }}
  annotations:
    {{- include "hazel.annotations" $ | nindent 4 }}
spec:
  type: ExternalName
  externalName: host.k3d.internal
  ports:
    - port: {{ $route.port }}
      targetPort: {{ $route.port }}
{{- end }}
{{- end }}
{{- end }}
